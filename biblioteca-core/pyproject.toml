[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "{{BIBLIOTECA_CORE}}"
version = "0.1.0"
description = "Biblioteca centralizada de conexões, log, auditoria e alertas para os jobs ETL gerados pela skill {{NOME_SKILL}}."
requires-python = ">=3.9"
dependencies = ["pyodbc>=5.0", "requests>=2.28"]

[project.optional-dependencies]
spark = ["pyspark>=3.3"]

[tool.setuptools.packages.find]
include = ["core*"]
